<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5efe4"/><stop offset=".5" stop-color="#c9e7ef"/><stop offset="1" stop-color="#f7d4c6"/></linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05060b"/><stop offset=".5" stop-color="#18102b"/><stop offset="1" stop-color="#052f3b"/></linearGradient>
    <linearGradient id="bgComplex" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f15b4a"/><stop offset=".3" stop-color="#e2c33e"/><stop offset=".58" stop-color="#1d9d9a"/><stop offset="1" stop-color="#642d93"/></linearGradient>
    <filter id="darkShadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.82"/></filter>
    <filter id="lightShadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fff" flood-opacity="0.86"/></filter>
    <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.34"/></filter>
    <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="0.8" fill="#fff" opacity=".12"/><circle cx="12" cy="14" r=".6" fill="#000" opacity=".1"/><circle cx="17" cy="7" r=".5" fill="#fff" opacity=".08"/></pattern>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans", sans-serif; }
      .eyebrow { fill:#aeb9d8; font-size:15px; letter-spacing:2.2px; font-weight:600; }
      .title { fill:#f8f8fb; font-size:34px; font-weight:700; }
      .copy { fill:#cad2e4; font-size:16px; }
      .cardTitle { fill:#eef1fa; font-size:17px; font-weight:700; }
      .label { fill:#ffffff; font-size:13px; font-weight:650; letter-spacing:.8px; }
      .current { fill:#fff; font-size:26px; font-weight:700; }
      .tiny { fill:#d5d9e7; font-size:12px; }
      .dark { fill:#101722; font-size:25px; font-weight:700; }
      .darkSmall { fill:#18202d; font-size:13px; font-weight:600; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#10162a"/>
  <text x="76" y="70" class="sf eyebrow">PHASE 2.3 · FLOATING TEXT CONTRAST</text>
  <text x="76" y="116" class="sf title">浅色、深色与复杂背景下的可读性</text>
  <text x="76" y="147" class="sf copy">不把“白字 + 固定黑影”当作唯一方案；按背景选择阴影、亮色阴影、描边/发光和轻遮罩。</text>

  <!-- light -->
  <g transform="translate(76 220)">
    <rect width="430" height="510" rx="22" fill="url(#bgLight)"/>
    <rect width="430" height="510" rx="22" fill="url(#noise)" opacity=".35"/>
    <text x="24" y="38" class="sf darkSmall">LIGHT WALLPAPER · adaptive light contrast</text>
    <g filter="url(#lightShadow)">
      <text x="28" y="152" class="sf current" fill="#fff">透明播放态</text>
      <text x="28" y="186" class="sf current" fill="#fff">白色阴影把字从浅底抬起</text>
    </g>
    <text x="28" y="241" class="sf darkSmall">推荐：亮色外发光 / 双向描边</text>
    <rect x="24" y="286" width="382" height="92" rx="16" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".42"/>
    <text x="43" y="324" class="sf dark">轻遮罩 fallback</text>
    <text x="43" y="352" class="sf darkSmall">只包裹歌词内容，不生成巨大面板</text>
    <text x="24" y="472" class="sf darkSmall">Readable · no gray block · no hard-coded black shadow</text>
  </g>

  <!-- dark -->
  <g transform="translate(585 220)">
    <rect width="430" height="510" rx="22" fill="url(#bgDark)"/>
    <circle cx="90" cy="120" r="130" fill="#9d5cff" opacity=".16"/>
    <circle cx="360" cy="420" r="180" fill="#37d3d5" opacity=".11"/>
    <text x="24" y="38" class="sf tiny">DARK WALLPAPER · default borderless</text>
    <g filter="url(#darkShadow)">
      <text x="28" y="152" class="sf current">当前行保持绝对焦点</text>
      <text x="28" y="186" class="sf current">暗色阴影保护细笔画</text>
    </g>
    <text x="28" y="241" class="sf tiny">推荐：暗色阴影 / 轻描边</text>
    <text x="28" y="324" class="sf" fill="#fff" opacity=".45" font-size="20" font-weight="550" filter="url(#darkShadow)">相邻行仍然可读</text>
    <text x="28" y="353" class="sf" fill="#fff" opacity=".65" font-size="13" filter="url(#darkShadow)">romaji stays secondary</text>
    <text x="24" y="472" class="sf tiny">Current 1.0 · adjacent 0.35–0.55 · no blur next door</text>
  </g>

  <!-- complex -->
  <g transform="translate(1094 220)">
    <rect width="430" height="510" rx="22" fill="url(#bgComplex)"/>
    <path d="M0 0h430v120c-120 45-200-40-310 25C74 175 36 150 0 165z" fill="#fff" opacity=".12"/>
    <path d="M0 400c120-75 190 55 295-30 55-45 95-30 135-10v150H0z" fill="#070b1f" opacity=".25"/>
    <rect width="430" height="510" rx="22" fill="url(#noise)" opacity=".28"/>
    <text x="24" y="38" class="sf tiny">COMPLEX WALLPAPER · material fallback</text>
    <rect x="24" y="94" width="382" height="246" rx="18" fill="#0c1020" fill-opacity=".22" stroke="#fff" stroke-opacity=".22" filter="url(#panelShadow)"/>
    <text x="48" y="145" class="sf current" filter="url(#darkShadow)">歌词仍然清晰</text>
    <text x="48" y="178" class="sf current" filter="url(#darkShadow)">但不被灰色大面板包围</text>
    <text x="48" y="226" class="sf tiny">选择依据：背景亮度、局部复杂度、用户手动偏好</text>
    <text x="48" y="292" class="sf" fill="#fff" opacity=".48" font-size="19" filter="url(#darkShadow)">相邻歌词弱化但不糊</text>
    <text x="24" y="472" class="sf tiny">Material is a content-sized safety net, not a second window</text>
  </g>

  <g transform="translate(76 794)">
    <rect width="1448" height="54" rx="18" fill="#0b1022" fill-opacity=".72" stroke="#aab7dc" stroke-opacity=".15"/>
    <text x="24" y="33" class="sf copy">可读性原则：</text><text x="136" y="33" class="sf copy">当前原文先保证可读 → 再弱化相邻行 → 再隐藏远处辅助层；绝不为保布局裁掉当前行原文。</text>
  </g>
</svg>
