<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151922"/><stop offset="0.55" stop-color="#06080c"/><stop offset="1" stop-color="#1c2028"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/><stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8c8ff"/><stop offset="1" stop-color="#223876"/></linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#94b9ff"/></marker>
    <style>
      .h { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; fill:#f4f6fb; font-size:24px; font-weight:650; }
      .l { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; fill:#8b96a8; font-size:13px; font-weight:650; letter-spacing:1.1px; }
      .b { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; fill:#e9ecf2; font-size:14px; font-weight:530; }
      .s { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; fill:#a1a9b7; font-size:12px; }
      .m { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; fill:#738096; font-size:11px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="72" y="68" class="h">Animation map · capsule.dynamicIslandDark.v4</text>
  <text x="72" y="97" class="s">static frames only · shared anchors, continuous geometry, no popover card</text>

  <!-- frame 1 -->
  <g transform="translate(92 180)">
    <text x="0" y="-28" class="l">A · COLLAPSED</text>
    <rect x="0" y="9" width="320" height="42" rx="21" fill="#000" opacity="0.6" filter="url(#shadow)"/>
    <rect x="0" y="0" width="320" height="42" rx="21" fill="url(#island)" stroke="#b4d0ff" stroke-opacity="0.16"/>
    <rect x="11" y="9" width="24" height="24" rx="7" fill="url(#cover)"/>
    <text x="48" y="26" class="b">恋風 · Lilas</text>
    <path d="M284 13v16l11-8z" fill="#fff"/>
    <text x="0" y="82" class="m">cover/title/play anchors</text>
  </g>

  <!-- frame 2 -->
  <g transform="translate(592 160)">
    <text x="0" y="-28" class="l">B · HOVER</text>
    <rect x="0" y="10" width="342" height="46" rx="23" fill="#000" opacity="0.64" filter="url(#shadow)"/>
    <rect x="0" y="0" width="342" height="46" rx="23" fill="url(#island)" stroke="#b4d0ff" stroke-opacity="0.18"/>
    <rect x="12" y="11" width="24" height="24" rx="7" fill="url(#cover)"/>
    <text x="49" y="22" class="b">恋風</text><text x="49" y="36" class="s">Lilas</text>
    <path d="M211 23h-12m0 0 4-4m-4 4 4 4" stroke="#fff" stroke-width="1.6" fill="none"/>
    <path d="M230 17v14l10-7z" fill="#fff"/>
    <path d="M258 17v14l-10-7z" fill="#fff"/>
    <text x="0" y="86" class="m">same cover/title anchors · controls crossfade</text>
  </g>

  <!-- frame 3 -->
  <g transform="translate(1020 126)">
    <text x="0" y="-28" class="l">C · EXPANDED</text>
    <rect x="0" y="15" width="500" height="160" rx="28" fill="#000" opacity="0.68" filter="url(#shadow)"/>
    <rect x="0" y="0" width="500" height="160" rx="28" fill="url(#island)" stroke="#b4d0ff" stroke-opacity="0.18"/>
    <rect x="20" y="20" width="62" height="62" rx="15" fill="url(#cover)"/>
    <text x="100" y="45" class="h" font-size="19">恋風</text>
    <text x="100" y="66" class="s">Lilas · 03:41</text>
    <path d="M26 122h200" stroke="#fff" stroke-opacity="0.18"/>
    <path d="M26 122h86" stroke="#c8dcff" stroke-opacity="0.76"/>
    <path d="M289 32v14l10-7z" fill="#fff"/><path d="M323 32v14l-10-7z" fill="#fff"/>
    <text x="258" y="87" class="b">風の向こうで君を待っている</text>
    <text x="258" y="110" class="s">kaze no mukou de kimi o matte iru</text>
    <text x="0" y="201" class="m">leading/center/trailing/bottom appear inside one contour</text>
  </g>

  <!-- anchor map -->
  <g transform="translate(92 410)">
    <rect width="1428" height="178" rx="24" fill="#090b10" stroke="#fff" stroke-opacity="0.09"/>
    <text x="30" y="42" class="l">SHARED ANCHORS</text>
    <circle cx="126" cy="96" r="7" fill="#a8c8ff"/><text x="144" y="101" class="b">cover</text>
    <circle cx="330" cy="96" r="7" fill="#a8c8ff"/><text x="348" y="101" class="b">title / artist</text>
    <circle cx="580" cy="96" r="7" fill="#a8c8ff"/><text x="598" y="101" class="b">transport</text>
    <circle cx="804" cy="96" r="7" fill="#a8c8ff"/><text x="822" y="101" class="b">one current lyric</text>
    <path d="M126 122C280 164 390 164 580 122" stroke="#94b9ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.8"/>
    <path d="M330 76C570 34 680 34 804 76" stroke="#94b9ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.8"/>
    <text x="1030" y="84" class="s">width grows left/right</text>
    <text x="1030" y="108" class="s">height grows mainly downward</text>
    <text x="1030" y="132" class="s">no second surface appears</text>
  </g>

  <!-- reduce motion -->
  <g transform="translate(92 648)">
    <text x="0" y="-24" class="l">REDUCE MOTION</text>
    <rect x="0" y="0" width="650" height="150" rx="24" fill="#0a0c11" stroke="#fff" stroke-opacity="0.09"/>
    <rect x="28" y="50" width="220" height="38" rx="19" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <text x="54" y="74" class="b">collapsed</text>
    <path d="M278 69h78" stroke="#94b9ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="388" y="35" width="220" height="68" rx="24" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <text x="417" y="65" class="b">expanded</text>
    <text x="417" y="84" class="s">direct frame + opacity</text>
    <text x="28" y="127" class="m">no spring · no blur morph · no long travel</text>
  </g>
</svg>
