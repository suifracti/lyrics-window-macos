<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141a"/>
      <stop offset="0.46" stop-color="#080a0e"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b0f"/>
      <stop offset="0.55" stop-color="#030406"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <linearGradient id="keyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bb7ff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8bb7ff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8bff"/>
      <stop offset="0.45" stop-color="#394cbd"/>
      <stop offset="1" stop-color="#101b4b"/>
    </linearGradient>
    <radialGradient id="coverGlow" cx="0.28" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#8bb7ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8bb7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#fff" opacity="0.14"/>
      <circle cx="17" cy="12" r="0.55" fill="#fff" opacity="0.09"/>
      <circle cx="10" cy="21" r="0.5" fill="#fff" opacity="0.08"/>
    </pattern>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; fill: #f5f7fb; font-size: 22px; font-weight: 650; letter-spacing: -0.4px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #e6e9ef; font-size: 16px; font-weight: 520; }
      .secondary { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #a5aab5; font-size: 13px; font-weight: 470; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #7e8796; font-size: 13px; font-weight: 600; letter-spacing: 1.4px; }
      .metric { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #636c7c; font-size: 12px; }
      .region { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8797b5; font-size: 12px; letter-spacing: 0.4px; }
      .line { stroke: #ffffff; stroke-opacity: 0.86; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .softline { stroke: #ffffff; stroke-opacity: 0.24; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#canvas)"/>
  <rect width="1600" height="1080" fill="url(#grain)" opacity="0.25"/>
  <text x="80" y="74" class="label">CAPSULE.DYNAMICISLANDDARK.V4</text>
  <text x="80" y="101" class="secondary">one continuous near-black island · macOS visual candidate</text>
  <path d="M80 128H1520" class="softline" opacity="0.35"/>

  <!-- collapsed -->
  <g transform="translate(80 178)">
    <text x="0" y="-26" class="label">COLLAPSED · 312 × 40 pt</text>
    <rect x="0" y="13" width="312" height="40" rx="20" fill="#000" opacity="0.55" filter="url(#shadow)"/>
    <rect x="0" y="0" width="312" height="40" rx="20" fill="url(#island)" stroke="url(#keyline)" stroke-width="1"/>
    <rect x="1" y="1" width="310" height="38" rx="19" fill="url(#coverGlow)" opacity="0.6"/>
    <rect x="9" y="8" width="24" height="24" rx="7" fill="url(#cover)"/>
    <circle cx="25" cy="15" r="4" fill="#c7d8ff" opacity="0.45"/>
    <path d="M13 27c5-6 9-6 17-1" stroke="#e8edff" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
    <text x="46" y="25" class="body">恋風</text>
    <text x="93" y="25" class="secondary">Lilas</text>
    <circle cx="276" cy="20" r="10" fill="#fff" opacity="0.05"/>
    <path d="M274 15v10l8-5z" fill="#f5f7fb"/>
    <text x="0" y="82" class="region">leading: cover + identity</text>
    <text x="183" y="82" class="region">trailing: playback state</text>
    <text x="0" y="109" class="metric">no separate cards · no notification banner · one line</text>
  </g>

  <!-- hover -->
  <g transform="translate(500 178)">
    <text x="0" y="-26" class="label">HOVER · 332 × 44 pt</text>
    <rect x="0" y="14" width="332" height="44" rx="22" fill="#000" opacity="0.6" filter="url(#shadow)"/>
    <rect x="0" y="0" width="332" height="44" rx="22" fill="url(#island)" stroke="url(#keyline)" stroke-width="1"/>
    <rect x="10" y="10" width="24" height="24" rx="7" fill="url(#cover)"/>
    <text x="47" y="19" class="body">恋風</text>
    <text x="47" y="34" class="secondary" font-size="11">Lilas</text>
    <path d="M181 22h-8m0 0 4-4m-4 4 4 4" class="line" opacity="0.75"/>
    <path d="M205 17v10l8-5z" fill="#f5f7fb"/>
    <path d="M238 17v10l-8-5z" fill="#f5f7fb"/>
    <path d="M270 16h13M276.5 16v12M270 28h13" class="line" opacity="0.38"/>
    <text x="0" y="82" class="region">identity remains leading</text>
    <text x="192" y="82" class="region">controls fade into same island</text>
    <text x="0" y="109" class="metric">height changes only +4 pt · no second card · no spacer</text>
  </g>

  <!-- expanded -->
  <g transform="translate(80 470)">
    <text x="0" y="-28" class="label">EXPANDED · 600 × 168 pt</text>
    <rect x="0" y="17" width="600" height="168" rx="30" fill="#000" opacity="0.68" filter="url(#shadow)"/>
    <rect x="0" y="0" width="600" height="168" rx="30" fill="url(#island)" stroke="url(#keyline)" stroke-width="1.2"/>
    <rect x="1" y="1" width="598" height="166" rx="29" fill="url(#coverGlow)" opacity="0.48"/>
    <!-- leading -->
    <rect x="22" y="22" width="68" height="68" rx="16" fill="url(#cover)"/>
    <circle cx="73" cy="38" r="12" fill="#d7e3ff" opacity="0.26"/>
    <path d="M33 80c14-17 27-17 49-3" stroke="#f0f4ff" stroke-opacity="0.34" stroke-width="2" fill="none"/>
    <text x="108" y="43" class="title">恋風</text>
    <text x="108" y="65" class="secondary">Lilas · 3:41</text>
    <text x="108" y="84" class="metric">leading · identity</text>
    <!-- left controls -->
    <g transform="translate(26 115)">
      <path d="M0 9l10-7v14zM10 9l10-7v14z" fill="#f5f7fb" opacity="0.86"/>
      <circle cx="55" cy="9" r="17" fill="#fff" opacity="0.08"/>
      <path d="M51 2v14l11-7z" fill="#f5f7fb"/>
      <path d="M101 2l10 7-10 7zM111 2l10 7-10 7z" fill="#f5f7fb" opacity="0.86"/>
    </g>
    <rect x="22" y="151" width="242" height="3" rx="1.5" fill="#fff" opacity="0.16"/>
    <rect x="22" y="151" width="102" height="3" rx="1.5" fill="#c8dcff" opacity="0.78"/>
    <text x="274" y="155" class="metric">01:34 / 03:41</text>
    <!-- divider is semantic, not a card -->
    <path d="M332 25V143" stroke="#fff" stroke-opacity="0.09" stroke-width="1"/>
    <!-- center / right lyric -->
    <text x="370" y="56" class="region">center · live lyric</text>
    <text x="370" y="92" class="title" font-size="24">風の向こうで君を待っている</text>
    <text x="370" y="119" class="secondary">kaze no mukou de kimi o matte iru</text>
    <text x="370" y="145" class="region" opacity="0.55">optional translation · one line only</text>
    <path d="M370 158H563" class="softline" opacity="0.55"/>
    <text x="370" y="194" class="region">leading: cover/metadata</text>
    <text x="535" y="194" class="region">center: lyric</text>
  </g>

  <!-- semantic annotations -->
  <g transform="translate(790 470)">
    <text x="0" y="-28" class="label">SPATIAL RULES</text>
    <rect x="0" y="0" width="730" height="310" rx="22" fill="#080a0e" stroke="#fff" stroke-opacity="0.08"/>
    <text x="28" y="45" class="title" font-size="19">one contour, four semantic zones</text>
    <text x="28" y="77" class="body">Leading and trailing are not separate cards.</text>
    <text x="28" y="102" class="body">Center owns the current lyric; bottom stays compact.</text>
    <path d="M28 130H702" class="softline"/>
    <text x="28" y="164" class="region">1 · preserve anchors</text>
    <text x="28" y="189" class="secondary">cover, title and controls keep their relative order</text>
    <text x="28" y="224" class="region">2 · expand mostly downward</text>
    <text x="28" y="249" class="secondary">left/right width grows; no popover layer appears</text>
    <text x="28" y="284" class="region">3 · reduce motion is opacity + direct frame</text>
  </g>

  <g transform="translate(80 890)">
    <text x="0" y="0" class="metric">v4 candidate · near-black island · weak keyline only · no third-party assets · static design artifact</text>
  </g>
</svg>
