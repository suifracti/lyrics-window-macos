<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/>
      <stop offset="0.5" stop-color="#080a0e"/>
      <stop offset="1" stop-color="#1d202a"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="coverBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8c8ff"/>
      <stop offset="1" stop-color="#1a3380"/>
    </linearGradient>
    <linearGradient id="coverWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb48a"/>
      <stop offset="1" stop-color="#7f2e50"/>
    </linearGradient>
    <linearGradient id="coverNone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30353e"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grain" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="0.65" fill="#fff" opacity="0.13"/>
      <circle cx="15" cy="14" r="0.45" fill="#fff" opacity="0.08"/>
    </pattern>
    <style>
      .heading { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; fill:#f6f7fb; font-size:24px; font-weight:650; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill:#8d97a8; font-size:13px; font-weight:650; letter-spacing:1.1px; }
      .cardtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill:#f0f2f6; font-size:16px; font-weight:620; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill:#9ba4b2; font-size:12px; font-weight:480; }
      .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill:#697587; font-size:11px; }
      .islandText { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill:#f4f5f8; font-size:13px; font-weight:600; }
      .islandSub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill:#a4aab5; font-size:10px; }
    </style>
  </defs>
  <rect width="1800" height="1420" fill="url(#bg)"/>
  <rect width="1800" height="1420" fill="url(#grain)" opacity="0.22"/>
  <text x="72" y="70" class="heading">Environment &amp; edge states</text>
  <text x="72" y="100" class="small">capsule.dynamicIslandDark.v4 · same near-black island, different screen/content constraints</text>

  <!-- screen environment cards -->
  <g transform="translate(72 148)">
    <rect width="520" height="300" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="28" y="38" class="label">01 · NOTCHED MAC</text>
    <rect x="28" y="62" width="464" height="190" rx="12" fill="#161a22" stroke="#fff" stroke-opacity="0.06"/>
    <path d="M202 62h116v13c0 15-12 27-27 27h-62c-15 0-27-12-27-27z" fill="#050608"/>
    <rect x="178" y="62" width="164" height="28" rx="14" fill="url(#island)" stroke="#a7c8ff" stroke-opacity="0.17"/>
    <rect x="188" y="69" width="16" height="16" rx="5" fill="url(#coverBlue)"/>
    <text x="213" y="80" class="islandText">恋風</text>
    <path d="M316 73v14l10-7z" fill="#fff"/>
    <text x="28" y="278" class="tiny">top anchor follows notch safe area; no extra forehead</text>
  </g>

  <g transform="translate(640 148)">
    <rect width="520" height="300" rx="22" fill="#10141b" stroke="#fff" stroke-opacity="0.09"/>
    <text x="28" y="38" class="label">02 · NO-NOTCH SCREEN</text>
    <rect x="28" y="62" width="464" height="190" rx="12" fill="#1d222c" stroke="#fff" stroke-opacity="0.06"/>
    <rect x="178" y="67" width="164" height="28" rx="14" fill="url(#island)" stroke="#a7c8ff" stroke-opacity="0.17"/>
    <rect x="188" y="74" width="16" height="16" rx="5" fill="url(#coverBlue)"/>
    <text x="213" y="85" class="islandText">恋風</text>
    <path d="M316 78v14l10-7z" fill="#fff"/>
    <path d="M170 60h180" stroke="#a7c8ff" stroke-opacity="0.2" stroke-dasharray="4 5"/>
    <text x="28" y="278" class="tiny">same pill envelope; y uses visibleFrame + safe top inset</text>
  </g>

  <g transform="translate(1208 148)">
    <rect width="520" height="300" rx="22" fill="#20242c" stroke="#fff" stroke-opacity="0.09"/>
    <text x="28" y="38" class="label">03 · COMPLEX DESKTOP</text>
    <rect x="28" y="62" width="464" height="190" rx="12" fill="#8f9da3"/>
    <path d="M28 62h464v190H28z" fill="#d3bfa5" opacity="0.28"/>
    <circle cx="108" cy="164" r="76" fill="#d99a6c" opacity="0.32"/>
    <circle cx="414" cy="132" r="92" fill="#557a91" opacity="0.4"/>
    <rect x="178" y="67" width="164" height="28" rx="14" fill="url(#island)" stroke="#fff" stroke-opacity="0.18"/>
    <rect x="188" y="74" width="16" height="16" rx="5" fill="url(#coverWarm)"/>
    <text x="213" y="85" class="islandText">恋風</text>
    <path d="M316 78v14l10-7z" fill="#fff"/>
    <text x="28" y="278" class="tiny">dark island stays stable; keyline remains subtle</text>
  </g>

  <text x="72" y="500" class="heading" font-size="20">Content boundaries</text>

  <!-- 04 long title -->
  <g transform="translate(72 536)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">04 · LONG TITLE</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#a7c8ff" stroke-opacity="0.17"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverWarm)"/>
    <text x="72" y="93" class="islandText">あまりにも長い歌曲名はここで…</text>
    <path d="M454 81v14l10-7z" fill="#fff"/>
    <text x="24" y="150" class="small">保留当前身份；只截断低优先级尾部。</text>
    <text x="24" y="181" class="tiny">title truncation before enlarging the island</text>
  </g>

  <!-- 05 multiple artists -->
  <g transform="translate(640 536)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">05 · MULTI-ARTIST</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#a7c8ff" stroke-opacity="0.17"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverBlue)"/>
    <text x="72" y="86" class="islandText">春を告げる</text>
    <text x="72" y="101" class="islandSub">yama · feat. guest</text>
    <path d="M454 81v14l10-7z" fill="#fff"/>
    <text x="24" y="150" class="small">艺人次序保留；过长的合作名单弱化或省略。</text>
    <text x="24" y="181" class="tiny">identity remains readable without a second line of controls</text>
  </g>

  <!-- 06 no artwork -->
  <g transform="translate(1208 536)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">06 · NO ARTWORK</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverNone)"/>
    <path d="M43 87c4-7 12-7 16 0M45 93c3-3 8-3 11 0" stroke="#8b96a8" stroke-width="1.4" fill="none"/>
    <text x="72" y="93" class="islandText">Unknown artwork</text>
    <path d="M454 81v14l10-7z" fill="#fff"/>
    <text x="24" y="150" class="small">用低对比系统占位，不生成巨大空白封面位。</text>
    <text x="24" y="181" class="tiny">placeholder stays inside the same leading slot</text>
  </g>

  <!-- 07 paused -->
  <g transform="translate(72 820)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">07 · PAUSED</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverBlue)"/>
    <text x="72" y="93" class="islandText">恋風</text>
    <path d="M454 80v16M462 80v16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="24" y="150" class="small">暂停只改变状态图标和进度显示，不改变岛体形状。</text>
    <text x="24" y="181" class="tiny">no optimistic long-lived playback state</text>
  </g>

  <!-- 08 no lyrics -->
  <g transform="translate(640 820)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">08 · NO LYRICS</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverWarm)"/>
    <text x="72" y="93" class="islandText">恋風 · no lyrics</text>
    <path d="M454 81v14l10-7z" fill="#fff"/>
    <text x="24" y="150" class="small">不显示假当前行；胶囊只保留歌曲状态。</text>
    <text x="24" y="181" class="tiny">no first-line preview and no fake sync</text>
  </g>

  <!-- 09 long lyric + reduce motion -->
  <g transform="translate(1208 820)">
    <rect width="520" height="230" rx="22" fill="#0b0d12" stroke="#fff" stroke-opacity="0.09"/>
    <text x="24" y="36" class="label">09 · LONG LYRIC / REDUCE MOTION</text>
    <rect x="24" y="64" width="472" height="46" rx="23" fill="url(#island)" stroke="#fff" stroke-opacity="0.13"/>
    <rect x="36" y="75" width="24" height="24" rx="7" fill="url(#coverBlue)"/>
    <text x="72" y="93" class="islandText">長い現在歌詞は優先して…</text>
    <path d="M454 81v14l10-7z" fill="#fff"/>
    <path d="M24 140h204" stroke="#fff" stroke-opacity="0.16"/>
    <path d="M24 140h112" stroke="#c8dcff" stroke-opacity="0.75"/>
    <text x="244" y="144" class="tiny">opacity + direct frame</text>
    <text x="24" y="181" class="tiny">long lyric: keep current line first; Reduce Motion: no spring</text>
  </g>

  <text x="72" y="1130" class="label">EDGE RULE</text>
  <text x="72" y="1162" class="small">当前原文、播放状态和歌曲身份优先；辅助层逐级弱化；所有状态都保留同一个连续 near-black island。</text>
  <text x="72" y="1195" class="tiny">static candidate only · no SwiftUI · no third-party assets · no existing mockup overwritten</text>
</svg>
