<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172c"/>
      <stop offset="0.52" stop-color="#151b37"/>
      <stop offset="1" stop-color="#3a1f40"/>
    </linearGradient>
    <linearGradient id="capsulePurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2554" stop-opacity="0.94"/>
      <stop offset="0.55" stop-color="#4c2862" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#1b2745" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="capsuleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d51" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#124b67" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#1b2942" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="coverPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.42" stop-color="#ca76ff"/>
      <stop offset="1" stop-color="#1a2049"/>
    </linearGradient>
    <linearGradient id="coverBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5fff7"/>
      <stop offset="0.42" stop-color="#61aeea"/>
      <stop offset="1" stop-color="#18234d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#fff" opacity="0.09"/>
      <circle cx="12" cy="10" r="0.7" fill="#fff" opacity="0.06"/>
      <circle cx="6" cy="16" r="0.5" fill="#fff" opacity="0.08"/>
    </pattern>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans", sans-serif; }
      .eyebrow { fill:#aeb9d8; font-size:15px; letter-spacing:2.2px; font-weight:600; }
      .title { fill:#f8f8fb; font-size:34px; font-weight:700; }
      .copy { fill:#c9d0e2; font-size:16px; }
      .muted { fill:#9ba5c2; font-size:14px; }
      .tiny { fill:#7e89a8; font-size:12px; letter-spacing:0.4px; }
      .pillText { fill:#f7f7fb; font-size:14px; font-weight:600; }
      .song { fill:#f8f8fb; font-size:14px; font-weight:650; }
      .artist { fill:#b9c2d6; font-size:11px; }
      .lyric { fill:#fff; font-size:13px; font-weight:580; }
      .annotation { fill:#e1b8ff; font-size:12px; font-weight:600; }
      .label { fill:#e1e5f0; font-size:16px; font-weight:650; }
      .measure { fill:#8d9bc3; font-size:12px; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#page)"/>
  <rect width="1600" height="980" fill="url(#grain)" opacity="0.55"/>
  <circle cx="1280" cy="100" r="290" fill="#9a5dff" opacity="0.09"/>
  <circle cx="280" cy="850" r="350" fill="#32b5ff" opacity="0.07"/>

  <text x="76" y="74" class="sf eyebrow">PHASE 2.3 · CAPSULE PRESENTATION</text>
  <text x="76" y="120" class="sf title">封面色驱动的轻沉浸胶囊</text>
  <text x="76" y="151" class="sf copy">三态共享 live projection；胶囊最多一行当前歌词，不承担多行字幕。</text>

  <!-- collapsed -->
  <g transform="translate(76 222)">
    <text x="0" y="0" class="sf label">COLLAPSED · 36–40pt</text>
    <text x="0" y="27" class="sf muted">歌名优先 · 单行 · 无进度条 · 无歌手 · 无下一句</text>
    <g transform="translate(0 58)" filter="url(#smallShadow)">
      <rect x="0" y="0" width="214" height="40" rx="20" fill="url(#capsulePurple)" stroke="#bd9cff" stroke-opacity="0.22"/>
      <rect x="9" y="8" width="24" height="24" rx="6" fill="url(#coverPurple)"/>
      <circle cx="21" cy="20" r="5" fill="#fff" opacity="0.15"/>
      <text x="45" y="25" class="sf song">心墙</text>
      <text x="181" y="25" class="sf pillText">Ⅱ</text>
    </g>
    <text x="0" y="138" class="sf tiny">[24 cover] [title or short lyric] [play state]</text>
    <line x1="0" y1="157" x2="214" y2="157" stroke="#98a8d8" stroke-opacity="0.4"/>
    <text x="0" y="183" class="sf measure">content-driven width 120–220pt · no notification banner</text>
  </g>

  <!-- hover -->
  <g transform="translate(530 222)">
    <text x="0" y="0" class="sf label">HOVER · 48–52pt</text>
    <text x="0" y="27" class="sf muted">信息在前，控制在后；不靠巨大 Spacer 拉开两端</text>
    <g transform="translate(0 58)" filter="url(#smallShadow)">
      <rect x="0" y="0" width="342" height="52" rx="26" fill="url(#capsuleBlue)" stroke="#7edaf0" stroke-opacity="0.25"/>
      <rect x="10" y="10" width="32" height="32" rx="8" fill="url(#coverBlue)"/>
      <text x="54" y="24" class="sf song">水曜日の約束</text>
      <text x="54" y="39" class="sf artist">Kawasaki.Rio</text>
      <g transform="translate(186 10)" fill="none" stroke="#f5f7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7 4 14l8 7"/><path d="M18 7 10 14l8 7"/>
        <path d="M46 8v12"/><path d="M40 8v12"/>
        <path d="M68 7 76 14l-8 7"/><path d="M62 7l8 7-8 7"/>
      </g>
      <circle cx="282" cy="26" r="15" fill="#fff" opacity="0.08"/>
      <path d="M277 22v8l8-5z" fill="#fff"/>
      <rect x="310" y="16" width="18" height="20" rx="6" fill="#fff" opacity="0.11"/>
      <path d="M315 26h8M319 22v8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="140" class="sf tiny">[32 cover] [title/artist] [prev] [play] [next] [expand]</text>
    <line x1="0" y1="160" x2="342" y2="160" stroke="#98a8d8" stroke-opacity="0.4"/>
    <text x="0" y="187" class="sf measure">content-driven width 260–340pt · controls never lead the reading order</text>
  </g>

  <!-- expanded -->
  <g transform="translate(1000 222)">
    <text x="0" y="0" class="sf label">EXPANDED · 156–196pt</text>
    <text x="0" y="27" class="sf muted">完整控制，但不是迷你主窗口</text>
    <g transform="translate(0 58)" filter="url(#shadow)">
      <rect x="0" y="0" width="348" height="192" rx="22" fill="url(#capsulePurple)" stroke="#d4b7ff" stroke-opacity="0.27"/>
      <rect x="16" y="16" width="56" height="56" rx="10" fill="url(#coverPurple)"/>
      <text x="88" y="36" class="sf song">心墙</text>
      <text x="88" y="54" class="sf artist">郭静 · 就是你</text>
      <text x="88" y="70" class="sf tiny">暂停中 · 01:20 / 03:46</text>
      <g transform="translate(244 26)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7 4 14l8 7"/><path d="M18 7 10 14l8 7"/>
        <path d="M45 8v12M39 8v12"/>
        <path d="M67 7 75 14l-8 7"/><path d="M61 7l8 7-8 7"/>
      </g>
      <rect x="16" y="95" width="252" height="4" rx="2" fill="#fff" opacity="0.18"/>
      <rect x="16" y="95" width="104" height="4" rx="2" fill="#fff" opacity="0.85"/>
      <circle cx="120" cy="97" r="4" fill="#fff"/>
      <text x="282" y="100" class="sf tiny">1:20</text>
      <g transform="translate(128 115)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 6 5 12l6 6"/><path d="M17 6l6 6-6 6"/>
        <path d="M48 4v16M42 4v16"/>
        <path d="M75 6 81 12l-6 6"/><path d="M69 6l6 6-6 6"/>
      </g>
      <text x="16" y="166" class="sf lyric">一个人眺望碧海和蓝天</text>
      <text x="16" y="181" class="sf tiny">当前歌词 · 一行截断，不显示下一句</text>
      <g transform="translate(274 155)" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="1" width="13" height="11" rx="2"/><path d="M4 15h13V4"/>
        <path d="M28 3c5 0 8 3 8 7s-3 7-8 7h-2l-4 3v-5c-2-1-3-3-3-5 0-4 3-7 9-7z"/>
      </g>
    </g>
    <text x="0" y="282" class="sf tiny">[56 cover] [metadata] [compact controls] [short progress] [one lyric] [icon entries]</text>
  </g>

  <!-- lower rules -->
  <g transform="translate(76 565)">
    <rect x="0" y="0" width="1448" height="300" rx="26" fill="#0c1021" fill-opacity="0.58" stroke="#b3c0ed" stroke-opacity="0.12"/>
    <text x="28" y="42" class="sf label">Visual guardrails</text>
    <g class="sf">
      <text x="28" y="83" class="copy">01</text><text x="78" y="83" class="copy">Collapsed 不显示歌手、进度条、下一句或多行歌词。</text>
      <text x="28" y="123" class="copy">02</text><text x="78" y="123" class="copy">Hover 控件永远排在歌曲信息之后；空间不足时先保留播放/暂停。</text>
      <text x="28" y="163" class="copy">03</text><text x="78" y="163" class="copy">Expanded 最多一行当前歌词；长句单行省略，不撑成主窗口。</text>
      <text x="28" y="203" class="copy">04</text><text x="78" y="203" class="copy">底部入口只使用可识别 SF Symbols，低频动作收进更多菜单。</text>
      <text x="28" y="243" class="copy">05</text><text x="78" y="243" class="copy">默认材质受封面色影响；无封面使用稳定 placeholder，不改变高度。</text>
    </g>
    <text x="1160" y="250" class="sf tiny">MOCKUP · NOT IMPLEMENTED</text>
  </g>
</svg>
